_target_: madlibs.prompt.llm.LLMPromptStrategy

# LLM model identifier passed to LiteLLM
model_id: gemini/gemini-3-flash-preview

# System instruction for seed mode (single prompt generation)
system_instruction: "Generate one brief music generation prompt, returning only the prompt text itself."
# User message used in seed mode
user_seed_text: "Create a detailed prompt for instrumental music generation."
# System instruction for caption alternate mode
alternates_system_instruction: "You generate musically coherent caption alternates. Return strict JSON with a `prompts` list and nothing else."
# LLM operation mode: seed | caption_alternates
generation_mode: caption_alternates

# Source caption corpus used in caption_alternates mode
caption_corpus_filename: ${hydra:runtime.cwd}/data/song_describer.csv
# Zero-based column index containing caption text
caption_column: 2
# Whether the caption file has a header row
caption_has_header: true
# Delimiter for tabular caption files
caption_delimiter: ","
# Optional column used to filter rows
caption_filter_column: 3
# Required value in filter column for row inclusion
caption_filter_value: "True"
# Number of alternates requested per source caption (K in K*N output size)
alternates_per_caption: 3
# Number of source captions sent per LLM request batch
captions_per_request: 8
# Optional cap on number of source captions used (null = all filtered rows)
max_source_captions: null
# Prefix enforced on generated prompts (empty string disables prefixing)
output_prefix: ""
# Optional POS lexicon path used for slot-template conversion
part_of_speech_filename: ${hydra:runtime.cwd}/data/parts_of_speech.txt

# POS categories replaced with [slot] markers in slot-template conversion
slot_pos:
  - adj
  - noun
  - verb
  - adv
# Tokenization pattern used for slot-template conversion
token_pattern: "[A-Za-z]+(?:[’'][A-Za-z]+)?(?:[-][A-Za-z]+(?:[’'][A-Za-z]+)?)*|[0-9]+|[.,!?;:]"
# Regex for validating candidate slot words
slot_word_pattern: "^[a-z][a-z\\-']+$"
# Minimum character length for slot words
min_slot_word_length: 2
# Maximum character length for slot words
max_slot_word_length: 20

# Maximum output length passed to the LLM API
max_new_tokens: 256
# Sampling temperature passed to the LLM API
temperature: 1.0

# Number of parallel request workers
num_workers: 32
