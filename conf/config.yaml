defaults:
  - prompt_strategy: madlibs
  - generator: musicgen
  - analysis: pipelines
  - analysis_type: mir
  - _self_

run:
  output_dir: outputs
  prompt_strategy_name: ${hydra:runtime.choices.prompt_strategy}
  gen_model_name: ${hydra:runtime.choices.generator}
  analysis_output_dir: ${hydra:run.dir}/${run.output_dir}/${run.prompt_strategy_name}/${run.gen_model_name}/mir
  prompts_filename: ${hydra:run.dir}/${run.output_dir}/${run.prompt_strategy_name}/prompts.txt
  generated_audio_dir: ${hydra:run.dir}/${run.output_dir}/${run.prompt_strategy_name}/${run.gen_model_name}/generated
  n_prompts: 1000
  seed: 0
  overwrite_prompts: false
  audio_glob: ${run.generated_audio_dir}/*/*/*.wav
  prompt_filename: prompt.txt
hydra:
  run:
    dir: ${hydra:runtime.cwd}/results
